        y1="950"
        x2="1530"
        y2="950"/>

</g>


<!-- DRS ZONE MARKERS -->

<g
    fill="#e10600">

    <circle cx="520" cy="310" r="7"/>

    <circle cx="1210" cy="270" r="7"/>

    <circle cx="600" cy="875" r="7"/>

</g>

</svg>/
* =========================================================
   SUBTLE F1 TRACK - DEMO BACKGROUND
   ========================================================= */

.f1-track-background {
    position: absolute !important;

    width: 1250px !important;
    height: 800px !important;

    right: -120px !important;
    top: 100px !important;

    z-index: 0 !important;

    pointer-events: none !important;

    opacity: 0.18 !important;
}

.f1-track-background img {
    width: 100% !important;
    height: 100% !important;

    object-fit: contain !important;

    opacity: 0.75 !important;

    display: block;
}


/* Keep every dashboard element above the track */

.main > *:not(.f1-track-background) {
    position: relative !important;

    z-index: 10 !important;
}


/* Remove excessive glow */

.f1-track-background::before {
    display: none !important;
}


/* =========================================================
   VIDEO / DEMO AREA
   ========================================================= */

.demo-video-panel {
    position: relative;

    background: rgba(8, 8, 8, 0.94);

    border: 1px solid #292929;

    border-left: 3px solid #e10600;

    border-radius: 5px;

    overflow: hidden;

    margin-bottom: 18px;
}

.demo-video-panel video {
    width: 100%;

    max-height: 520px;

    display: block;

    object-fit: contain;

    background: #000;
}

.demo-video-overlay {
    position: absolute;

    top: 15px;
    left: 15px;

    padding: 6px 10px;

    background: rgba(225, 6, 0, 0.9);

    color: white;

    font-size: 9px;

    font-weight: 900;

    letter-spacing: 1.5px;
}